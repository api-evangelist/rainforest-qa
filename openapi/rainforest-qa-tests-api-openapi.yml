            - draft
            - archived
            - all
            - unarchived
      - in: query
        name: tags[]
        description: Only untag tests having all specified tags; use `-1` to filter for untagged tests
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: run_id[]
        description: Only untag tests that were in this/these previous run(s)
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      responses:
        '204':
          description: Untag a group of tests
      tags:
      - tests
      operationId: delete-tests-tags
      x-rdme-order: 8
