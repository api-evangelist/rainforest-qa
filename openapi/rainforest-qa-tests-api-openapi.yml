components:
  schemas:
    put-test-regenerate:
      type: object
      properties:
        ai_mode:
          type: string
          description: Set to `self-heal` to turn on self-healing for snippets
          enum:
          - self-heal
        browsers:
          type: array
          description: List of browsers that the test runs on by default; you can find a list of possible options via the client API
          items:
            type: string
        category:
          type: string
          description: Test category
          enum:
          - site
          - app
        connection_id:
          type: string
          description: Connection to route test execution through (geographic location or custom tunnel)
        reroute_geo:
          type: string
          description: 'Deprecated: use connection_id instead'
        description:
          type: string
          description: Test notes
        environment_id:
          type: integer
          format: int32
          description: Environment used to get initial_navigate_url (only concerns Visual Editor tests)
        feature_id:
          type: integer
          format: int32
          description: Test feature
        login_snippet_id:
          type: integer
          format: int32
          description: ID of a snippet to use for login steps at the start of AI test generation. Mutually exclusive with prompt_credentials
        owner_id:
          type: integer
          format: int32
          description: Test owner
        priority:
          type: string
          description: Test priority
          enum:
          - P1
          - P2
          - P3
          - ''
        prompt:
          type: string
          description: Prompt for self-healing snippets or AI generated tests
        prompt_credentials:
          type: string
          description: Login credentials for AI test generation (e.g. 'username / password'). Mutually exclusive with login_snippet_id
        rfml_id:
          type: string
          description: RFML ID for this test
        site_id:
          type: integer
          format: int32
          description: Tested site
        start_uri:
          type: string
          description: The path this test starts at; if present, must start with a /
        state:
          type: string
          description: Test state
          enum:
          - enabled
          - disabled
          - draft
          - archived
        tags:
          type: array
          description: Test tags
          items:
            type: string
        title:
          type: string
          description: 'Test title (maximum length: 255 characters)'
        type:
          type: string
          description: The type of test to create
          enum:
          - snippet
          - test
        atc_settings:
          type: object
          properties:
            delay_after:
              type: integer
              format: int32
              description: Delay(seconds) in execution after every verb
          required:
          - delay_after
        slim:
          type: boolean
          description: If true, returns less data in order to reduce latency and response size
          default: false
      description: Regenerate a test with AI from a new prompt
