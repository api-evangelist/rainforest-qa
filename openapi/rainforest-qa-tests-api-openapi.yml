        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: step_query
        description: Only untag tests whose steps match this string
        required: false
        schema:
          type: string
      - in: query
        name: tests
        description: Only untag tests matching this criteria. Can be comma-separated list of test ids or 'all' to untag all tests
        required: false
        schema:
          type: string
      - in: query
        name: type
        description: Only untag tests of this type
        required: false
        schema:
          type: string
          enum:
          - snippet
          - test
      - in: query
        name: variable
        description: Only untag tests that contain given variable
        required: false
        schema:
          type: string
      - in: query
        name: embedded
        description: If true, only untag tests that are embedded in other tests. If false, only untag tests that are not embedded in other tests.
        required: false
        schema:
          type: boolean
      - in: query
        name: owner_id
        description: Only untag tests owned by this user; use `-1` to filter for tests without an owner
        required: false
