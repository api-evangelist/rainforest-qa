          type: array
          description: Only run tests for this/these site(s)
          items:
            type: integer
            format: int32
        smart_folder_id:
          type: integer
          format: int32
          description: Only run tests in this saved filter
        state:
          type: array
          description: Only run tests that with this state
          items:
            type: string
            enum:
            - enabled
            - disabled
            - draft
            - archived
            - all
            - unarchived
        step_query:
          type: string
          description: Only run tests whose steps match this string
        tags:
          type: array
          description: Only run tests having all specified tags; use `-1` to filter for untagged tests
          items:
            type: string
        tests:
          type: string
          description: Only run tests matching this criteria. Can be comma-separated list of test ids or 'all' to run all tests
        type:
          type: string
          description: Only run tests of this type
          enum:
          - snippet
          - test
        run_id:
          type: array
          description: Only run tests that were in this/these previous run(s)
          items:
            type: integer
            format: int32
        variable:
          type: string
          description: Only run tests that contain given variable
        embedded:
          type: boolean
          description: If true, only run tests that are embedded in other tests. If false, only run tests that are not embedded in other tests.
        owner_id:
          type: integer
          format: int32
          description: Only run tests owned by this user; use `-1` to filter for tests without an owner
        test_language:
          type: string
          description: Only run tests with a specified language
          enum:
          - plain_english
          - rainforest_test_language
        browsers:
          type: array
          description: An array of browsers to run this against, overrides the defaults; you can find a list of possible options via the client API
          items:
            type: string
        execution_method:
          type: string
          description: The execution method to use for this run
          enum:
          - crowd
          - automation
          - automation_and_crowd
          - on_premise
        crowd:
          type: string
          description: The crowd to use for this run
          enum:
          - default
          - on_premise_crowd
          - automation
          - automation_and_crowd
        description:
          type: string
          description: An arbitrary string to associate with the run
        environment_id:
          type: integer
          format: int32
          description: Use a specific environment for this run
        mode:
          type: string
          description: Set the run mode to standard or draft
          enum:
          - standard
          - draft
          default: standard
        release:
          type: string
          description: Manually entered release information about the release the run is associated with
        connection_id:
          type: string
          description: Reroute tests through a specific location for this run; values are `default` to turn off, `usa` for USA, `can` for Canada, `deu` for Germany, `sgp` for Singapore, and `aus` for Australia, or the id of a connection if you have a custom connection
        reroute_geo:
          type: string
          description: 'Deprecated: please use `connection.id` instead'
        webhook:
          type: string
          format: url
          description: HTTP webhook that we will POST notifications to; we expect a confirmation callback for `before_test` webhooks
        conflict:
          type: string
          description: How should we handle current other runs that are in progress; values are `cancel` to cancel runs in the same environment as your new run and `cancel-all` to cancel all runs
          enum:
          - cancel
          - cancel-all
