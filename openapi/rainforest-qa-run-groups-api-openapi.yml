openapi: 3.0.0
info:
  title: Rainforest callback run_groups API
  description: Nearly all interactions done in Rainforest can be done via the API. Find your API Token (for the CLIENT_TOKEN header field) on the integration settings page (https://app.rainforestqa.com/settings/integrations).
  version: '1'
servers:
- url: https://app.rainforestqa.com/api
security:
- api_key: []
tags:
- name: run_groups
  description: Operations about run_groups
paths:
  /1/run_groups:
    get:
      summary: List run groups
      description: List run groups
      parameters:
      - in: query
        name: title
        description: Filter by title (case-insensitive)
        required: false
        schema:
          type: string
      - in: query
        name: sort[][title]
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - asc
            - desc
      - in: query
        name: page
        description: Page of results to display
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: page_size
        description: 'Number of results to return per page; maximum: 100'
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: Run groups retrieved
          headers:
            X-Total-Pages:
              description: Total pages
              schema:
                type: integer
            X-Current-Page:
              description: Current page
              schema:
                type: integer
            X-Per-Page:
              description: The maximum number of results per page
              schema:
                type: integer
            X-Total-Results:
              description: The total number of results
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunGroup'
      tags:
      - run_groups
      operationId: get-run_groups
      x-rdme-order: 1
    post:
      summary: Create a new run group
      description: Create a new run group
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/post-run_groups'
        required: true
      responses:
        '201':
          description: Run group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunGroup'
        '400':
          description: Run group could not created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - run_groups
      operationId: post-run_groups
      x-rdme-order: 2
  /1/run_groups/{id}/elements/batch:
    post:
      summary: Add multiple elements to a run group
      description: Add multiple elements to a run group
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/post-run_group-elements-batch'
        required: true
      responses:
        '201':
          description: Element(s) added to run group
        '400':
          description: Element(s) could not be added to run group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Run group or element not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - run_groups
      operationId: post-run_group-elements-batch
      x-rdme-order: 40
    delete:
      summary: Remove multiple elements from a run group
      description: Remove multiple elements from a run group
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: elements[][type]
        description: The element's type
        required: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - feature
            - filter
            - tag
            - test
      - in: query
        name: elements[][element_id]
        description: The feature, filter, or test's id
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - in: query
        name: elements[][name]
        description: The tag's name
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Element(s) removed from run group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '404':
          description: Run group or element not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - run_groups
      operationId: delete-run_group-elements-batch
      x-rdme-order: 41
  /1/run_groups/{id}:
    get:
      summary: Get a run group
      description: Get a run group
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Run group retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunGroup'
        '404':
          description: Run group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - run_groups
      operationId: get-run_group
      x-rdme-order: 10
    put:
      summary: Update a run group
      description: Update a run group
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/put-run_group'
        required: true
      responses:
        '200':
          description: Update a run group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunGroup'
      tags:
      - run_groups
      operationId: put-run_group
      x-rdme-order: 11
    delete:
      summary: Delete a run group
      description: Delete a run group
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Run group deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunGroup'
        '404':
          description: Run group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - run_groups
      operationId: delete-run_group
      x-rdme-order: 12
  /1/run_groups/{id}/runs:
    get:
      summary: Get runs for a run group
      description: Get runs for a run group
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: page
        description: Page of results to display
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: page_size
        description: 'Number of results to return per page; maximum: 100'
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: Run group runs retrieved
          headers:
            X-Total-Pages:
              description: Total pages
              schema:
                type: integer
            X-Current-Page:
              description: Current page
              schema:
                type: integer
            X-Per-Page:
              description: The maximum number of results per page
              schema:
                type: integer
            X-Total-Results:
              description: The total number of results
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Run'
        '404':
          description: Run group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - run_groups
      operationId: get-run_group-runs
      x-rdme-order: 20
    post:
      summary: Create a new run group run
      description: Create a new run group run
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/post-run_group-runs'
        required: true
      responses:
        '201':
          description: Run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          description: Run group could not created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - run_groups
      operationId: post-run_group-runs
      x-rdme-order: 21
  /1/run_groups/{id}/elements:
    get:
      summary: Get run group elements
      description: Get run group elements
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: sort[][title]
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - asc
            - desc
      - in: query
        name: sort[][created_at]
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - asc
            - desc
      - in: query
        name: sort[][updated_at]
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - asc
            - desc
      - in: query
        name: sort[][priority]
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - asc
            - desc
      - in: query
        name: page
        description: Page of results to display
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: page_size
        description: 'Number of results to return per page; maximum: 100'
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: Run group elements retrieved
          headers:
            X-Total-Pages:
              description: Total pages
              schema:
                type: integer
            X-Current-Page:
              description: Current page
              schema:
                type: integer
            X-Per-Page:
              description: The maximum number of results per page
              schema:
                type: integer
            X-Total-Results:
              description: The total number of results
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunGroupElement'
        '404':
          description: Run group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - run_groups
      operationId: get-run_group-elements
      x-rdme-order: 30
    post:
      summary: Add an element to a run group
      description: Add an element to a run group
      parameters:
      - in: path
