      operationId: get-run_group-element
      x-rdme-order: 50
    delete:
      summary: Remove an element from a run group
      description: Remove an element from a run group
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: element_id
        description: The element ID
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Element removed from run group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunGroupElement'
        '404':
          description: Run group or element not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - run_groups
      operationId: delete-run_group-element
      x-rdme-order: 51
components:
  schemas:
    RunGroupElement:
      type: object
      properties:
        id:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        run_group_id:
          type: integer
          format: int32
          description: The element's run group's ID
        run_group_title:
          type: string
          description: The element's run group's title
        type:
          type: string
          enum:
          - test
          - feature
          - filter
          - tag
        element:
          type: object
          description: Details of the test, feature, or filter
      description: RunGroupElement model
    RunProgress:
      type: object
      properties:
        percent:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
        complete:
          type: integer
          format: int32
        passed:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        no_result:
          type: integer
          format: int32
        eta:
          type: object
    Schedule:
      type: object
      properties:
        id:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        repeat_rules:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRule'
        timezone:
          type: string
    RunTestReview:
      type: object
      properties:
        id:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        status:
          type: string
        reason:
          type: string
        reason_updated_at:
          type: string
        run_id:
          type: string
        run:
          type: string
        test_id:
          type: string
        resolved:
          type: string
        transitioned_by:
          $ref: '#/components/schemas/UserLite'
        notified_user:
          $ref: '#/components/schemas/UserLite'
        reviewer:
          $ref: '#/components/schemas/UserLite'
        test:
          type: object
          properties:
            crowd:
              type: string
            execution_method:
              type: string
            last_run:
              type: string
            test_lite:
              $ref: '#/components/schemas/Tests_Lite'
        transitioned_at:
          type: string
        updated_at:
          type: string
    Tests_Lite:
      type: object
      properties:
        id:
          type: string
        created_at:
          type: string
        test_id:
          type: string
        title:
          type: string
        result:
          type: string
        wisp:
          type: string
        prompt:
          type: string
        prompt_credentials:
          type: string
        ai_mode:
          type: string
        priority:
          type: string
        real_cost_to_run:
          type: string
        owner_id:
          type: string
        state:
          type: string
        updated_at:
          type: string
        deleted:
          type: string
        feature_id:
          type: string
    Connection:
      type: object
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        name:
          type: string
        api_token:
          type: string
        state:
          type: string
        link_state:
          type: string
        type:
          type: string
          enum:
          - rainforest
          - user
      description: Connection model
    RunGroup:
      type: object
      properties:
        id:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        title:
          type: string
        reroute_geo:
          type: string
          description: 'Deprecated: please use `connection.id` instead'
        connection:
          $ref: '#/components/schemas/Connection'
        crowd:
          type: string
          enum:
          - default
          - on_premise_crowd
          - automation
          - automation_and_crowd
        execution_method:
          type: string
          enum:
          - crowd
          - automation
          - automation_and_crowd
          - on_premise
        browsers:
          type: array
          items:
            type: string
        schedule:
          $ref: '#/components/schemas/Schedule'
        environment:
          $ref: '#/components/schemas/Environment'
        test_count:
          type: integer
          format: int32
      description: RunGroup model
    post-run_groups:
      type: object
      properties:
        title:
          type: string
          description: Title for the run group
        reroute_geo:
          type: string
          description: Geo to reroute tests for this run group
        environment_id:
          type: integer
          format: int32
          description: Use a specific environment for this run group
        crowd:
          type: string
          description: The crowd to use for this run group
          enum:
          - default
          - on_premise_crowd
          - automation
          - automation_and_crowd
        execution_method:
          type: string
          description: The execution method to use for this run group
          enum:
          - crowd
          - automation
          - automation_and_crowd
          - on_premise
        browsers:
          type: array
          description: An array of browsers to use for this run group, overrides the defaults; you can find a list of possible options via the client API
          items:
            type: string
        schedule:
          type: object
          description: A schedule to use for this run group
          properties:
            timezone:
              type: string
              description: The timezone scheduled runs are based on
              enum:
