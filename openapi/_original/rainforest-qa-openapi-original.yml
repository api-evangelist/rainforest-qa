components:
  securitySchemes:
    api_key:
      type: apiKey
      name: CLIENT_TOKEN
      in: header
  schemas:
    Connection:
      type: object
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        name:
          type: string
        api_token:
          type: string
        state:
          type: string
        link_state:
          type: string
        type:
          type: string
          enum:
          - rainforest
          - user
      description: Connection model
    create-connection:
      type: object
      properties:
        name:
          type: string
          description: Connection name
      required:
      - name
      description: Create connection
    rename-connection:
      type: object
      properties:
        name:
          type: string
          description: Connection name
      required:
      - name
      description: Rename connection
    Error:
      type: object
      properties:
        error:
          type: string
          description: An error message describing what went wrong
      required:
      - error
      description: Error model
    Client:
      type: object
      properties:
        id:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        client_id:
          type: integer
          format: int32
        name:
          type: string
        enabled_features:
          type: array
          items:
            type: string
        enabled_atc_features:
          type: array
          items:
            type: string
        default_environment_id:
          type: integer
          format: int32
        default_site_id:
          type: integer
          format: int32
        api_token:
          type: string
          format: password
        algolia_key:
          type: string
          format: password
        settings:
          type: object
        billing_email:
          type: string
          format: email
        timezone:
          type: string
        run_count:
          type: integer
          format: int32
        test_count:
          type: integer
          format: int32
        snippet_count:
          type: integer
          format: int32
        current_test_count:
          type: integer
          format: int32
        current_plan_test_count_limit:
          type: integer
          format: int32
        available_browsers:
          $ref: '#/components/schemas/BrowserWithDefault'
        owner_email:
          type: string
          format: email
        currently_running:
          $ref: '#/components/schemas/RunLite'
        browser_credit_costs:
          $ref: '#/components/schemas/BrowserCreditCost'
        concurrent_tester_limit:
          type: integer
          format: int32
        virtual_card_limit:
          type: integer
          format: int32
          description: Only rendered if you use [Virtual Credit Cards](https://help.rainforestqa.com/docs/virtual-credit-cards)
        has_private_sms_numbers:
          type: boolean
      description: Client model
    BrowserWithDefault:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum:
          - browser
          - software
          - tablet
          - phone
        browser_version:
          type: string
        os_version:
          type: string
        credit_cost:
          type: integer
          format: int32
        mobile_os_type:
          type: string
          enum:
          - ios
          - android
        mobile_device_type:
          type: string
          enum:
          - vm
          - real_device
        default:
          type: boolean
    RunLite:
      type: object
      properties:
        id:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - queued
          - validating
          - downloading_app
          - waiting_for_test_initialization
          - analyzing_app
          - error
          - sending_webhook
          - in_progress
          - aborting
          - aborted
          - timed_out
          - waiting_for_callback
          - complete
          - pending_investigation
        requested_tests:
          type: array
          items:
            type: integer
            format: int32
        current_progress:
          $ref: '#/components/schemas/RunProgress'
        credit_cost:
          type: integer
          format: int32
        result:
          type: string
          enum:
          - passed
          - failed
          - no_result
        updated_at:
          type: string
          format: date-time
        environment:
          $ref: '#/components/schemas/Environment'
    RunProgress:
      type: object
      properties:
        percent:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
        complete:
          type: integer
          format: int32
        passed:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        no_result:
          type: integer
          format: int32
        eta:
          type: object
    Environment:
      type: object
      properties:
        id:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        name:
          type: boolean
        default:
          type: boolean
        webhook:
          type: string
          format: url
        webhook_enabled:
          type: boolean
        is_temporary:
          type: boolean
        deleted_at:
          type: string
          format: date-time
          description: Only rendered if the environment is deleted
        site_environments:
          type: array
          items:
            $ref: '#/components/schemas/SiteEnvironment'
        will_delete_after:
          type: string
          format: date-time
          description: Only rendered if `is_temporary` is `true`
      required:
      - name
      - default
      - webhook
      - webhook_enabled
      - is_temporary
      - site_environments
      description: Environment model
    SiteEnvironment:
      type: object
      properties:
        id:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        site_id:
          type: integer
          format: int32
        environment_id:
          type: integer
          format: int32
        url:
          type: string
          format: url
      required:
      - site_id
      - environment_id
      - url
    BrowserCreditCost:
      type: object
      properties:
        id:
          type: integer
          format: int32
        browser_id:
          type: integer
          format: int32
        browser_key:
          type: string
        credit_cost:
          type: integer
          format: int32
    put-clients:
      type: object
      properties:
        name:
          type: string
          description: Account name
        billing_alert_threshold:
          type: integer
          format: int32
          description: The threshold, in cents, at which you wish to be notified of
            an upcoming invoice's amount (only editable by the account owner)
        billing_email:
          type: string
          format: email
          description: A dedicated billing email address (only editable by the account
            owner)
        default_execution_method:
