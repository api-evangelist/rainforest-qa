          type: array
          description: Only run tests that with this state
          items:
            type: string
            enum:
            - enabled
            - disabled
            - draft
            - archived
            - all
            - unarchived
        step_query:
          type: string
          description: Only run tests whose steps match this string
        tags:
          type: array
          description: Only run tests having all specified tags; use `-1` to filter
            for untagged tests
          items:
            type: string
        tests:
          type: string
          description: Only run tests matching this criteria. Can be comma-separated
            list of test ids or 'all' to run all tests
        type:
          type: string
          description: Only run tests of this type
          enum:
          - snippet
          - test
        run_id:
          type: array
          description: Only run tests that were in this/these previous run(s)
          items:
            type: integer
            format: int32
        variable:
          type: string
          description: Only run tests that contain given variable
        embedded:
          type: boolean
          description: If true, only run tests that are embedded in other tests. If
            false, only run tests that are not embedded in other tests.
        owner_id:
          type: integer
          format: int32
          description: Only run tests owned by this user; use `-1` to filter for tests
            without an owner
        test_language:
          type: string
          description: Only run tests with a specified language
          enum:
          - plain_english
          - rainforest_test_language
