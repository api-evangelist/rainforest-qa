openapi: 3.0.0
info:
  title: Rainforest API
  description: Nearly all interactions done in Rainforest can be done via the API.
    Find your API Token (for the CLIENT_TOKEN header field) on the integration settings
    page (https://app.rainforestqa.com/settings/integrations).
  version: '1'
servers:
- url: https://app.rainforestqa.com/api
security:
- api_key: []
tags:
- name: callback
  description: Operations about callbacks
- name: clients
  description: Operations about clients
- name: connections
  description: Operations about connections
- name: credit_cards
  description: Operations about credit_cards
- name: environments
  description: Operations about environments
- name: features
  description: Operations about features
- name: folders
  description: Operations about folders
- name: generators
  description: Operations about generators
- name: on_premise_crowd
  description: Operations about on_premise_crowds
- name: run_groups
  description: Operations about run_groups
- name: runs
  description: Operations about runs
- name: site_environments
  description: Operations about site_environments
- name: sites
  description: Operations about sites
- name: tags
  description: Operations about tags
- name: test_results
  description: Operations about test_results
- name: tests
  description: Operations about tests
- name: users
  description: Operations about users
- name: vm_stack
  description: Operations about vm_stacks
paths:
  /1/connections:
    get:
      summary: List connections
      description: List connections
      parameters:
      - in: query
        name: page
        description: Page of results to display
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: page_size
        description: 'Number of results to return per page; maximum: 100'
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: List connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
      tags:
      - connections
      operationId: get-connections
    post:
      summary: Creates a new connection
      description: Create connection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-connection'
        required: true
      responses:
        '201':
          description: Create connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
      tags:
      - connections
      operationId: create-connection
      x-rdme-order: 1
  /1/connections/{id}:
    get:
      summary: Get connection
      description: Get connection
      parameters:
      - in: path
        name: id
        description: Connection ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Get connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
      tags:
      - connections
      operationId: get-connection
    put:
      summary: Rename connection
      description: Rename connection
      parameters:
      - in: path
        name: id
        description: Connection ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/rename-connection'
        required: true
      responses:
        '200':
          description: Rename connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
      tags:
      - connections
      operationId: rename-connection
    delete:
      summary: Delete connection
      description: Delete connection
      parameters:
      - in: path
        name: id
        description: Connection ID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Delete connection
      tags:
      - connections
      operationId: delete-connection
  /1/connections/{id}/status:
    get:
      summary: Get connection status
      description: Get connection status
      parameters:
      - in: path
        name: id
        description: Connection ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Get connection status
      tags:
      - connections
      operationId: get-connection-status
  /1/connections/{id}/regenerate_api_token:
    put:
      summary: Regenerate API token
      description: Regenerate API token
      parameters:
      - in: path
        name: id
        description: Connection ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Regenerate API token
      tags:
      - connections
      operationId: regenerate-api-token
  /1/callback/run/{run_id}/{callback_type}/{digest}:
    post:
      summary: Notify Rainforest when a run webhook callback is complete
      description: 'Notify Rainforest when a `before_run` webhook callback is complete.
        See the [Using Webhooks article](https://help.rainforestqa.com/docs/using-webhooks#running-a-test-using-an-advanced-webhook)
        for more information.

        '
      parameters:
      - in: path
        name: run_id
        description: The ID of the Run you are sending a callback for
        required: true
        schema:
          type: string
      - in: path
        name: callback_type
        description: '`before_run` is currently the only type that is handled by this
          endpoint'
        required: true
        schema:
          type: string
          enum:
          - initializing_run
          - before_run
          - after_run
      - in: path
        name: digest
        description: MD5-HMAC Digest created with [Rainforest Auth](https://github.com/rainforestapp/auth)
        required: true
        schema:
          type: string
      security: []
      responses:
        '201':
          description: Callback successfully handled
        '400':
          description: Callback already processed; Invalid `callback_type`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid digest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - callback
      operationId: post-callback
      x-rdme-order: 1
  /1/clients:
    get:
      summary: Fetch your account details
      description: Fetch your account details
      responses:
        '200':
          description: Retrieved account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
      tags:
      - clients
      operationId: get-clients
      x-rdme-order: 1
    put:
      summary: Update account information
      description: Update account information
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/put-clients'
        required: true
      responses:
        '200':
          description: Updated client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          description: Could not update client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - clients
      operationId: put-clients
      x-rdme-order: 2
  /1/clients/stats:
    get:
      summary: Fetch usage stats
      description: Fetch usage stats
      responses:
        '200':
          description: Fetch usage stats
      tags:
      - clients
      operationId: get-client-stats
      x-rdme-order: 3
  /1/clients/select:
    post:
      summary: Select different client
      description: Select different client
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/post-clients-select'
        required: true
      responses:
        '201':
          description: Switched to a different client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          description: Cannot switch to the current client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Cannot switch to a client you do not have access to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - clients
      operationId: post-clients-select
      x-rdme-order: 4
  /1/credit_cards:
    get:
      summary: List credit cards
      description: List credit cards
      responses:
        '200':
          description: Retrieved credit cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCards'
      tags:
      - credit_cards
      operationId: get-credit_cards
      x-rdme-order: 1
  /1/environments:
    get:
      summary: List environments
      description: List environments
      parameters:
      - in: query
        name: name
        description: Filter by name (case-insensitive)
        required: false
        schema:
          type: string
      - in: query
        name: page
        description: Page of results to display
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: page_size
        description: 'Number of results to return per page; maximum: 100'
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: Retrieved environments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Environment'
      tags:
      - environments
      operationId: get-environments
      x-rdme-order: 1
    post:
      summary: Create a new environment
      description: Create a new environment and corresponding site-environments for
        each site as well
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/post-environments'
        required: true
      responses:
        '201':
          description: Environment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          description: Environment could not be created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - environments
      operationId: post-environments
      x-rdme-order: 2
  /1/environments/{environment_id}:
    get:
      summary: Get an environment
      description: Get an environment
      parameters:
      - in: path
        name: environment_id
        description: An environment ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Environment retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '404':
          description: Environment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - environments
      operationId: get-environment
      x-rdme-order: 10
    put:
      summary: Update an environment
      description: Update an environment
      parameters:
      - in: path
        name: environment_id
        description: An environment ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/put-environment'
        required: true
      responses:
        '200':
          description: Environment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          description: Environment could not be updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Environment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - environments
      operationId: put-environment
      x-rdme-order: 11
    delete:
      summary: Delete an environment
      description: Delete an environment and its associated site-environments
      parameters:
      - in: path
        name: environment_id
        description: An environment ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Environment deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          description: Environment could not be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Environment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - environments
      operationId: delete-environment
      x-rdme-order: 12
  /1/features:
    get:
      summary: List features
      description: List features
      parameters:
      - in: query
        name: title
        description: Filter by title (case-insensitive)
        required: false
        schema:
          type: string
      - in: query
        name: page
        description: Page of results to display
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: page_size
        description: 'Number of results to return per page; maximum: 100'
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - in: query
        name: sort[][title]
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - asc
            - desc
      - in: query
        name: sort[][updated_at]
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - asc
            - desc
      responses:
        '200':
          description: Features retrieved
          headers:
            X-Total-Pages:
              description: Total pages
              schema:
                type: integer
            X-Current-Page:
              description: Current page
              schema:
                type: integer
            X-Per-Page:
              description: The maximum number of results per page
              schema:
                type: integer
            X-Total-Results:
              description: The total number of results
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feature'
      tags:
      - features
      operationId: get-features
      x-rdme-order: 1
    post:
      summary: Create a new feature
      description: Create a new feature
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/post-features'
        required: true
      responses:
        '201':
          description: Feature created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
        '400':
          description: Feature could not be created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - features
      operationId: post-features
      x-rdme-order: 2
  /1/features/{id}:
    get:
      summary: Get a feature
      description: Get a feature
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Feature retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
        '404':
          description: Feature not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - features
      operationId: get-feature
      x-rdme-order: 10
    put:
      summary: Update a feature
      description: Update a feature
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/put-feature'
        required: true
      responses:
        '200':
          description: Feature updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
        '400':
          description: Feature could not be updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Feature not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - features
      operationId: put-feature
      x-rdme-order: 11
    delete:
      summary: Delete a feature
      description: Delete a feature
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Feature deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
        '404':
          description: Feature not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - features
      operationId: delete-feature
      x-rdme-order: 12
  /1/features/{id}/tests:
    post:
      summary: Add tests to a feature
      description: Add tests to a feature
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/post-feature-tests'
        required: true
      responses:
        '201':
          description: Tests added to feature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
        '400':
          description: Can't add snippets to a Feature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Feature not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - features
      operationId: post-feature-tests
      x-rdme-order: 13
    delete:
      summary: Remove tests from a feature
      description: Remove tests from a feature
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: category
        description: Only return tests with this category
        required: false
        schema:
          type: string
          enum:
          - app
          - site
      - in: query
        name: exploratory_run_id
        description: Only return created in this exploratory run
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: priority
        description: Only return tests with this priority
        required: false
        schema:
          type: string
          enum:
          - P1
          - P2
          - P3
          - ''
          - not_prioritized
      - in: query
        name: query
        description: Only return tests whose title contains, or ID matches, this string
        required: false
        schema:
          type: string
      - in: query
        name: result
        description: Only return tests with a specific result
        required: false
        schema:
          type: string
          enum:
          - passed
          - failed
          - no_result
      - in: query
        name: run_group_id
        description: Only return tests in this run group; use `-1` to filter for tests
          not in any run groups
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: smart_folder_id
        description: Only return tests in this saved filter
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: step_query
        description: Only return tests whose steps match this string
        required: false
        schema:
          type: string
      - in: query
        name: tests
        description: Only return tests matching this criteria. Can be comma-separated
          list of test ids or 'all' to return all tests
        required: false
        schema:
          type: string
      - in: query
        name: type
        description: Only return tests of this type
        required: false
        schema:
          type: string
          enum:
          - snippet
          - test
      - in: query
        name: variable
        description: Only return tests that contain given variable
        required: false
        schema:
          type: string
      - in: query
        name: embedded
        description: If true, only return tests that are embedded in other tests.
          If false, only return tests that are not embedded in other tests.
        required: false
        schema:
          type: boolean
      - in: query
        name: owner_id
        description: Only return tests owned by this user; use `-1` to filter for
          tests without an owner
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: test_language
        description: Only return tests with a specified language
        required: false
        schema:
          type: string
          enum:
          - plain_english
          - rainforest_test_language
      - in: query
        name: feature_id[]
        description: Only return tests with this/these feature(s); use `-1` to filter
          for tests without a feature
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - in: query
        name: site_id[]
        description: Only return tests for this/these site(s)
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - in: query
        name: state[]
        description: Only return tests that with this state
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - enabled
            - disabled
            - draft
            - archived
            - all
            - unarchived
      - in: query
        name: tags[]
        description: Only return tests having all specified tags; use `-1` to filter
          for untagged tests
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: run_id[]
        description: Only return tests that were in this/these previous run(s)
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      responses:
        '200':
          description: Tests removed from feature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
        '404':
          description: Feature not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - features
      operationId: delete-feature-tests
      x-rdme-order: 14
  /1/folders:
    get:
      summary: List folders
      description: List folders
      parameters:
      - in: query
        name: page
        description: Page of results to display
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: page_size
        description: 'Number of results to return per page; maximum: 100'
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - in: query
        name: title
        description: Filter by title (case-insensitive)
        required: false
        schema:
          type: string
      - in: query
        name: type
        description: Filter by type
        required: false
        schema:
          type: string
          enum:
          - filter
          - tag
      responses:
        '200':
          description: Folders retrieved
          headers:
            X-Total-Pages:
              description: Total pages
              schema:
                type: integer
            X-Current-Page:
              description: Current page
              schema:
                type: integer
            X-Per-Page:
              description: The maximum number of results per page
              schema:
                type: integer
            X-Total-Results:
              description: The total number of results
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SmartFolder'
      tags:
      - folders
      operationId: get-folders
      x-rdme-order: 1
    post:
      summary: Create a new folder
      description: Create a new folder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/post-folders'
        required: true
      responses:
        '201':
          description: Folder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmartFolder'
        '400':
          description: Could not create folder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - folders
      operationId: post-folders
      x-rdme-order: 2
  /1/folders/{id}:
    get:
      summary: Get a folder
      description: Get folder details including a paginated list of tests
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: without_tests
        description: Return folder data without tests and test_count
        required: false
        schema:
          type: boolean
      - in: query
        name: page
        description: Page of results to display
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: page_size
        description: 'Number of results to return per page; maximum: 100'
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: Folder retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmartFolder'
        '404':
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - folders
      operationId: get-folder
      x-rdme-order: 10
    put:
      summary: Update a folder
      description: Update a folder
      parameters:
