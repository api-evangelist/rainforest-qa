            repeat_rules:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    format: int32
                    description: A rule ID
                  time:
                    type: string
                    description: A time of day, in HH:mm format
                  day:
                    type: string
                    description: A week day
                    enum:
                    - sunday
                    - monday
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                required:
                - time
                - day
          required:
          - repeat_rules
      required:
      - title
      description: Create a new run group
    post-run_group-elements-batch:
      type: object
      properties:
        elements:
          type: array
          description: Elements to be added to the run group
          items:
            type: object
            properties:
              type:
                type: string
                description: The element's type
                enum:
                - feature
                - filter
                - tag
                - test
              element_id:
                type: integer
                format: int32
                description: The feature, filter, or test's id
              name:
                type: string
                description: The tag's name
            required:
            - type
      required:
      - elements
      description: Add multiple elements to a run group
    put-run_group:
      type: object
      properties:
        title:
          type: string
          description: Title for the run group
        reroute_geo:
          type: string
          description: Geo to reroute tests for this run group
        environment_id:
          type: integer
          format: int32
          description: Use a specific environment for this run group
        crowd:
          type: string
          description: The crowd to use for this run group
          enum:
          - default
          - on_premise_crowd
          - automation
          - automation_and_crowd
        execution_method:
          type: string
          description: The execution method to use for this run group
          enum:
          - crowd
          - automation
          - automation_and_crowd
          - on_premise
        browsers:
