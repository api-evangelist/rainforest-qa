            you can find a list of possible options via the client API
          items:
            type: string
        execution_method:
          type: string
          description: The execution method to use for this run
          enum:
          - crowd
          - automation
          - automation_and_crowd
          - on_premise
        crowd:
          type: string
          description: The crowd to use for this run
          enum:
          - default
          - on_premise_crowd
          - automation
          - automation_and_crowd
        description:
          type: string
          description: An arbitrary string to associate with the run
        environment_id:
          type: integer
          format: int32
          description: Use a specific environment for this run
        mode:
          type: string
          description: Set the run mode to standard or draft
          enum:
          - standard
          - draft
          default: standard
        release:
          type: string
          description: Manually entered release information about the release the
            run is associated with
        connection_id:
          type: string
          description: Reroute tests through a specific location for this run; values
