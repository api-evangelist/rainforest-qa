aid: rainforest-qa
name: Rainforest QA
description: >-
  Rainforest QA is a no-code software testing platform that combines AI-powered
  test creation, crowdsourced manual QA, and automated browser testing in one
  place. Its REST API and command-line interface let teams create and manage
  tests, environments, sites and folders, trigger and rerun test runs, and pull
  JUnit results directly from CI/CD pipelines. Run-lifecycle webhooks
  (initializing_run, before_run, after_run) with HMAC-signed callbacks support
  advanced deploy-gated integrations. Authentication is via a CLIENT_TOKEN API
  key header.
